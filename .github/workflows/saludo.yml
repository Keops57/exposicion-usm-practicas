name: Saludo a nuevos contribuyentes

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  saludo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "¡Hola @${{ github.actor }}! Gracias por abrir tu primer issue 🎉"
          pr-message: "¡Bienvenido @${{ github.actor }}! Gracias por tu primer PR 🚀 Revisaremos tus cambios pronto."